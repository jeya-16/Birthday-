<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chandru Memory 2 ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;600&family=Poppins&display=swap" rel="stylesheet">


<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background: linear-gradient(
180deg,
#0f0f0f,
#3d1028,
#8b2e5d,
#f7a8c9
);

font-family:'Poppins',sans-serif;

text-align:center;

min-height:100vh;

padding:40px 20px;

color:white;

}

button{

margin-top:35px;

padding:15px 35px;

font-size:20px;

font-family:'Poppins',sans-serif;

background:linear-gradient(135deg,#ff4f9a,#b5175d);

color:white;

border:none;

border-radius:30px;

box-shadow:0 0 18px rgba(255,79,154,0.6);

}
.container{
max-width:900px;
margin:auto;
}

.photo{
width:300px;
border-radius:20px;
box-shadow:0 0 20px hotpink;
}

.quote{
font-family:'Playfair Display',serif;
font-size:28px;
color:white;
line-height:1.8;
font-style:italic;
margin-top:30px;
text-shadow:0 2px 6px rgba(0,0,0,.3);
}

.birthday{
font-family:'Playfair Display',serif;
font-size:40px;
color:white;
margin-top:25px;
}

.floating{
position:fixed;
bottom:-60px;
font-size:28px;
animation:floatUp 8s linear infinite;
pointer-events:none;
}

@keyframes floatUp{
    0%{
        transform: translateY(0) translateX(0);
        opacity: 0;
    }
    10%{
        opacity: 1;
    }
    25%{
        transform: translateY(-25vh) translateX(-15px) rotate(-5deg);
    }
    50%{
        transform: translateY(-50vh) translateX(15px) rotate(5deg);
    }
    75%{
        transform: translateY(-75vh) translateX(-10px) rotate(-5deg);
    }
    100%{
        transform: translateY(-120vh) translateX(10px) rotate(5deg);
        opacity: 0;
    }
}
#musicBtn{
margin-top:20px;
background:none;
border:none;
font-size:30px;
cursor:pointer;
box-shadow:none;
padding:0;
}
</style>

</head>


<body>

<div class="container">


<img src="IMG-20260728-WA0009.jpg.png" class="photo">


<p class="quote">

Your smile makes every moment beautiful.<br>
You are a precious part of my life ❤️

</p>


<h2 class="birthday">

❤️ Wishing You A Beautiful Birthday ❤️

</h2>

<button onclick="location.href='photos3.html'">
Let's Continue... ❤️
</button>


</div>
<script>
const icons = ["❤️","💖","💕","🎈"];

function createFloating(){
    const item = document.createElement("div");
    item.className = "floating";
    item.innerHTML = icons[Math.floor(Math.random() * icons.length)];

    item.style.left = Math.random() * 100 + "vw";
    item.style.fontSize = (20 + Math.random() * 20) + "px";
    item.style.animationDuration = (6 + Math.random() * 4) + "s";

    document.body.appendChild(item);

    setTimeout(() => item.remove(), 10000);
}

setInterval(createFloating, 500);
</script>
<button id="musicBtn" onclick="toggleMusic()">▶️</button>

<script src="photo music.js"></script>
</body>

</html>
