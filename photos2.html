<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chandru Memory 2 ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;600&family=Poppins&display=swap" rel="stylesheet">


<style>

body{
background:linear-gradient(180deg,#ff9a9e,#fad0c4,#ffd1dc);
font-family:'Poppins',sans-serif;
text-align:center;
padding:40px 20px;
color:white;
}

.container{
max-width:900px;
margin:auto;
}

.photo{
width:300px;
border-radius:20px;
box-shadow:0 0 20px hotpink;
}

.quote{
font-family:'Playfair Display',serif;
font-size:28px;
line-height:1.8;
font-style:italic;
margin-top:30px;
}

.birthday{
font-family:'Playfair Display',serif;
font-size:38px;
margin-top:25px;
}

button{
margin-top:35px;
padding:15px 35px;
font-size:20px;
border:none;
border-radius:30px;
background:hotpink;
color:white;
box-shadow:0 0 15px deeppink;
}
.floating{
    position: fixed;
    bottom: -100px;
    font-size: 28px;
    pointer-events: none;
    animation: floatUp 8s linear infinite;
    z-index: 1;
}

@keyframes floatUp{
    0%{
        transform: translateY(0) translateX(0);
        opacity: 0;
    }
    10%{
        opacity: 1;
    }
    25%{
        transform: translateY(-25vh) translateX(-15px) rotate(-5deg);
    }
    50%{
        transform: translateY(-50vh) translateX(15px) rotate(5deg);
    }
    75%{
        transform: translateY(-75vh) translateX(-10px) rotate(-5deg);
    }
    100%{
        transform: translateY(-120vh) translateX(10px) rotate(5deg);
        opacity: 0;
    }
}
</style>

</head>


<body>

<div class="container">


<img src="IMG-20260728-WA0009.jpg.png" class="photo">


<p class="quote">

Your smile makes every moment beautiful.<br>
You are a precious part of my life ❤️

</p>


<h2 class="birthday">

❤️ Wishing You A Beautiful Birthday ❤️

</h2>


<button onclick="location.href='photos3.html'">

One More Memory ❤️

</button>


</div>
<script>
const icons = ["❤️","💖","💕","🎈"];

function createFloating(){
    const item = document.createElement("div");
    item.className = "floating";
    item.innerHTML = icons[Math.floor(Math.random() * icons.length)];

    item.style.left = Math.random() * 100 + "vw";
    item.style.fontSize = (20 + Math.random() * 20) + "px";
    item.style.animationDuration = (6 + Math.random() * 4) + "s";

    document.body.appendChild(item);

    setTimeout(() => item.remove(), 10000);
}

setInterval(createFloating, 500);
</script>
</body>

</html>
