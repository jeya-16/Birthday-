<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Memories ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:linear-gradient(
45deg,
#5b1f4d,
#8b2e5d,
#d96aa7
);

font-family:'Poppins',sans-serif;
overflow:hidden;
height:100vh;
display:flex;
justify-content:center;
align-items:center;

}

h1{
position:absolute;
top:35px;
font-family:'Great Vibes',cursive;
font-size:48px;
color:#ffffff;

text-shadow:
0 0 10px #ff9ecf,
0 0 20px #ff5fa2,
0 0 40px #ff2d75;

letter-spacing:2px;
}

.frame{
width:330px;
height:430px;
background:rgba(255,255,255,0.12);
padding:15px;
border:2px solid rgba(255,255,255,0.4);
border-radius:20px;
backdrop-filter:blur(8px);

box-shadow:0 10px 30px rgba(0,0,0,.35);

transform:none;
transition:.5s;

margin-top:-60px;
}
.letter-btn:hover{

transform:scale(1.05);

box-shadow:0 0 25px rgba(217,106,167,.9);

}

.frame:hover{
transform:none;
}

.frame img{
width:100%;
height:100%;
object-fit:cover;
border-radius:12px;
}

.heart{
position:absolute;
bottom:-40px;
color:#ff4d88;
font-size:20px;
animation:float 8s linear infinite;
}

@keyframes float{
0%{
transform:translateY(0);
opacity:0;
}
20%{
opacity:1;
}
100%{
transform:translateY(-120vh);
opacity:0;
}
}
.letter-btn{

position:absolute;
bottom:15px;

padding:12px 30px;

background:rgba(255,255,255,0.12);

border:2px solid rgba(255,255,255,0.25);

backdrop-filter:blur(10px);

color:white;

font-size:20px;
font-family:'Poppins',sans-serif;

border-radius:50px;

box-shadow:0 0 20px rgba(255,255,255,.15);

transition:.3s;

}

.letter-btn:hover{

transform:scale(1.05);

background:rgba(255,255,255,0.18);

box-shadow:0 0 25px rgba(255,255,255,.3);

}
#musicBtn{
position:absolute;
bottom:75px;
left:50%;
transform:translateX(-50%);
background:none;
border:none;
font-size:20px;
cursor:pointer;
box-shadow:none;
padding:0;
z-index:999;
}
</style>
</head>

<body>

<h1>Our Memories ❤️</h1>

<div class="frame">
<img id="slide" src="couple photo 1.jpg.jpg">
</div>
<button onclick="location.href='letter.html'" class="letter-btn">
💌 My Words
</button>

<script>

const photos=[
"couple photo 1.jpg.jpg",
"couple photo 2.jpg.png",
"couple photo 3.jpg.jpg",
"couple photo 4.jpg.jpg",
"couple photo 5.jpg.png",
"couple photo 6.jpg.jpg",
"couple photo 7.jpg.jpg",
"couple photo 8.jpg.jpg",
"couple photo 9.jpg.jpg",
"couple photo 10.jpg.jpg",
"couple photo 11.jpg.jpg",
"couple photo 12.jpg.jpg",
"couple photo 13.jpg.jpg",
"couple photo 14.jpg.jpg",
"couple photo 15.jpg.jpg",
"couple photo 16.jpg.jpg",
"couple photo 17.jpg.jpg",
"couple photo 18.jpg.jpg",
"couple photo 19.jpg.jpg",
"couple photo 20.jpg.jpg",
"couple photo 21.jpg.jpg",
"couple photo 22.jpg.jpg"
];

let i=0;

setInterval(()=>{
i=(i+1)%photos.length;
document.getElementById("slide").src=photos[i];
},3000);

function createHeart(){

const heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤";
heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=(15+Math.random()*20)+"px";
heart.style.animationDuration=(5+Math.random()*5)+"s";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},9000);

}

setInterval(createHeart,400);

</script>
<button id="musicBtn" onclick="toggleMusic()">❤️</button>
<script src="couple music.js"></script>
</body>
</html>
