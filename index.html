<!DOCTYPE html>
<html>

<head>

<title>Birthday Surprise ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:radial-gradient(circle,#8b0000,#000000);
font-family:Arial, sans-serif;
}

#count{
font-family:'Bebas Neue', sans-serif;
font-size:350px;
font-weight:bold;
color:white;


text-shadow:
0 0 20px red,
0 0 40px crimson,
0 0 80px red;

position:relative;
z-index:5;

}


/* Firework */

.firework{

position:absolute;
width:6px;
height:6px;

background:white;
border-radius:50%;

box-shadow:
0 0 10px white,
0 0 20px red;

animation:explode 1s ease-out forwards;

}

@keyframes explode{

0%{

transform:translate(0,0) scale(1);
opacity:1;

}

100%{

transform:
translate(var(--x),var(--y))
scale(0);

opacity:0;

}

}

</style>

</head>


<body>


<div id="count">3</div>



<script>

let count = 3;
let text = document.getElementById("count");

text.innerHTML = count;

let timer = setInterval(() => {

count--;

if(count > 0){

text.innerHTML = count;

}else{

clearInterval(timer);

window.location.href = "home.html";

}

},1500);
function firework(){

let x = Math.random() * window.innerWidth;
let y = Math.random() * window.innerHeight;

for(let i = 0; i < 120; i++){

let spark = document.createElement("div");

spark.className = "firework";

spark.style.left = x + "px";
spark.style.top = y + "px";

spark.style.setProperty("--x",(Math.random()*1000-500)+"px");
spark.style.setProperty("--y",(Math.random()*1000-500)+"px");

document.body.appendChild(spark);

setTimeout(()=>{
spark.remove();
},1000);

}

}

setInterval(firework,900);
</script>


</body>

</html>
