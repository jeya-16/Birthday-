<body style="margin:0; background:linear-gradient(to bottom,#ff9a9e,#fad0c4); font-family:Arial; display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; text-align:center; overflow:hidden;">
<button onclick="window.location.href='surprise.html'"
style="background:#ff4d88;
color:white;
padding:15px 30px;
font-size:65px;
border:none;
border-radius:30px;
box-shadow:0 0 15px #ff4d88;

</button>
<div class="hearts">❤️</div>
<div class="hearts">💕</div>
<div class="hearts">💖</div>
<div class="hearts">❤️</div>
<div class="hearts">💗</div>
<style>
.hearts {
  font-size: 60px;
  position: fixed;
  bottom: 0;
  left: 50%;
  animation: move 4s infinite;
}
.hearts:nth-of-type(1) {
  left: 20%;
  animation-delay: 0s;
}

.hearts:nth-of-type(2) {
  left: 40%;
  animation-delay: 1s;
}

.hearts:nth-of-type(3) {
  left: 60%;
  animation-delay: 2s;
}

.hearts:nth-of-type(4) {
  left: 75%;
  animation-delay: 0.5s;
}

.hearts:nth-of-type(5) {
  left: 90%;
  animation-delay: 1.5s;
}
@keyframes move {
  from {
    transform: translateY(0);
    opacity: 1;
  }
  to {
    transform: translateY(-500px);
    opacity: 0;
  }
}
</style>

</body>
