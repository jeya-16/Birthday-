<!DOCTYPE html>
<html>

<head>

<title>TEST123</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:radial-gradient(circle,#8b0000,#000000);
font-family:Arial,sans-serif;
}

#count{
font-family:'Bebas Neue',sans-serif;
font-size:350px;
font-weight:bold;
color:white;

text-shadow:
0 0 20px red,
0 0 40px crimson,
0 0 80px red;

position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
z-index:5;
}


.firework{

position:absolute;
width:6px;
height:6px;

background:white;
border-radius:50%;

box-shadow:
0 0 10px white,
0 0 20px red;

animation:explode 1s ease-out forwards;

}


@keyframes explode{

0%{
transform:translate(0,0) scale(1);
opacity:1;
}

100%{

transform:
translate(var(--x),var(--y))
scale(0);

opacity:0;

}

}

#musicBtn{

position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);

padding:24px 50px;
font-size:30px;
font-weight:bold;

border:none;
border-radius:60px;

background:linear-gradient(45deg,#ff4d6d,#ff1493);
color:white;

cursor:pointer;

z-index:99999;

box-shadow:0 0 20px #ff4d6d,
           0 0 40px #ff1493;

}

#passwordScreen{
position:fixed;
width:100%;
height:100%;
background:linear-gradient(135deg,#ff9acb,#ff1493);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:999999;
}

#passwordScreen input{
padding:12px;
border-radius:10px;
border:none;
font-size:18px;
text-align:center;
}

#passwordScreen button{
padding:12px 30px;
border:none;
border-radius:20px;
font-size:18px;
background:white;
color:#ff1493;
}
</style>

</head>


<body>
<div id="passwordScreen">

<h2 style="font-size:50px;">HELLO JEYA</h2>

<input type="password" id="password" placeholder="Password">

<br><br>

<button onclick="checkPassword()">Open ❤️</button>

<p id="error"></p>

</div>


<div id="mainContent" style="display:none;">

<div id="count"></div>



<button id="musicBtn" onclick="startMusic()">
🎶 Play Music
</button>



<script>


let text=document.getElementById("count");

function startMusic(){

playMusic();

musicBtn.style.display="none";

startCountdown();

}



function startCountdown(){

let count=3;

text.innerHTML=count;


let timer=setInterval(()=>{


count--;


if(count>0){

text.innerHTML=count;

}

else{


clearInterval(timer);


firework();


setTimeout(()=>{

window.location.href="home.html";

},2000);


}


},1500);


}




function firework(){


let x=Math.random()*window.innerWidth;
let y=Math.random()*window.innerHeight;


for(let i=0;i<120;i++){


let spark=document.createElement("div");

spark.className="firework";


spark.style.left=x+"px";
spark.style.top=y+"px";


spark.style.setProperty("--x",(Math.random()*1000-500)+"px");

spark.style.setProperty("--y",(Math.random()*1000-500)+"px");


document.body.appendChild(spark);


setTimeout(()=>{

spark.remove();

},1000);


}


}


setInterval(firework,900);


</script>
</div>
<script>

let wrongAttempts = 0;

function checkPassword(){

let pass = document.getElementById("password").value;
let error = document.getElementById("error");

if(pass === "forever1608SJ"){

document.getElementById("passwordScreen").style.display="none";

document.getElementById("mainContent").style.display="block";

}

else{

wrongAttempts++;

if(wrongAttempts >= 3){

error.innerHTML="🔒 Only Chandru ❤️";

document.getElementById("password").disabled=true;

}

else{

error.innerHTML="❌ Wrong Password";

}

}

}

</script>
<script src="music.js"></script>
</body>

</html>
