<!DOCTYPE html>
<html>

<head>

<title>Birthday Surprise ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:radial-gradient(circle,#8b0000,#000000);
font-family:Arial,sans-serif;
}

#count{
font-family:'Bebas Neue',sans-serif;
font-size:350px;
font-weight:bold;
color:white;

text-shadow:
0 0 20px red,
0 0 40px crimson,
0 0 80px red;

position:relative;
z-index:5;
}


.firework{

position:absolute;
width:6px;
height:6px;

background:white;
border-radius:50%;

box-shadow:
0 0 10px white,
0 0 20px red;

animation:explode 1s ease-out forwards;

}


@keyframes explode{

0%{
transform:translate(0,0) scale(1);
opacity:1;
}

100%{

transform:
translate(var(--x),var(--y))
scale(0);

opacity:0;

}

}


#musicBtn{

padding:18px 35px;
font-size:24px;
font-weight:bold;

border:none;
border-radius:50px;

background:#ff4d6d;
color:white;

cursor:pointer;

z-index:99999;

}


</style>

</head>


<body>


<div id="count"></div>


<audio id="bgm" loop>
<source src="Vaseegara.mp3" type="audio/mpeg">
</audio>


<button id="musicBtn" onclick="startMusic()">
🎶 Play Music
</button>



<script>


let text=document.getElementById("count");
let musicBtn=document.getElementById("musicBtn");
let bgm=document.getElementById("bgm");


function startMusic(){

bgm.play();

musicBtn.style.display="none";

startCountdown();

}



function startCountdown(){

let count=3;

text.innerHTML=count;


let timer=setInterval(()=>{


count--;


if(count>0){

text.innerHTML=count;

}

else{


clearInterval(timer);


firework();


setTimeout(()=>{

window.location.href="home.html";

},2000);


}


},1500);


}




function firework(){


let x=Math.random()*window.innerWidth;
let y=Math.random()*window.innerHeight;


for(let i=0;i<120;i++){


let spark=document.createElement("div");

spark.className="firework";


spark.style.left=x+"px";
spark.style.top=y+"px";


spark.style.setProperty("--x",(Math.random()*1000-500)+"px");

spark.style.setProperty("--y",(Math.random()*1000-500)+"px");


document.body.appendChild(spark);


setTimeout(()=>{

spark.remove();

},1000);


}


}


setInterval(firework,900);


</script>


</body>

</html>
