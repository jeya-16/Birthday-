<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Chandru ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;600&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
overflow:hidden;
background:linear-gradient(180deg,#ffd6e8,#ffc2d6,#ffb3d9);
font-family:'Poppins',sans-serif;
position:relative;
}

h1{
font-family:'Great Vibes',cursive;
font-size:70px;
color:white;
line-height:1.2;
text-shadow:
0 0 10px #fff,
0 0 20px deeppink,
0 0 40px hotpink;
}

h1 span{
display:block;
font-size:95px;
color:#ff2d75;
-webkit-text-stroke:2px white;
text-shadow:
0 0 10px white,
0 0 25px deeppink,
0 0 45px hotpink;
}

.from{
margin-top:20px;
font-family:'Great Vibes',cursive;
font-size:34px;
color:#d81b60;
text-shadow:0 0 8px pink;
}

button{
margin-top:40px;
padding:18px 40px;
font-size:30px;
font-family:'Playfair Display',serif;
background:#ff4d88;
color:white;
border:none;
border-radius:50px;
cursor:pointer;
box-shadow:
0 0 15px #ff4d88,
0 0 30px hotpink;
transition:.3s;
}

button:hover{
transform:scale(1.08);
}

.hearts{
position:absolute;
bottom:-60px;
font-size:45px;
animation:float 6s linear infinite;
opacity:.9;
}

@keyframes float{
0%{
transform:translateY(0);
opacity:1;
}
100%{
transform:translateY(-110vh);
opacity:0;
}
}</style>
</head>

<body>

<h1>
Happy Birthday
<span>Chandru ❤️</span>
</h1>

<p class="from">
With Love,<br>
Jeya 💖
</p>

<button onclick="window.location.href='surprise.html'">
💖 Just For You 💖
</button>

<div class="hearts" style="left:10%;animation-delay:0s;">❤️</div>
<div class="hearts" style="left:25%;animation-delay:1s;">💕</div>
<div class="hearts" style="left:40%;animation-delay:2s;">💖</div>
<div class="hearts" style="left:60%;animation-delay:3s;">💗</div>
<div class="hearts" style="left:75%;animation-delay:1.5s;">💝</div>
<div class="hearts" style="left:90%;animation-delay:2.5s;">❤️</div>

</body>
</html>
