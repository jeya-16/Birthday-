<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Chandru ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;600&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    align-items:center;
    text-align:center;
    overflow-x:hidden;
    overflow-y:auto;
    padding:50px 20px;
    background:linear-gradient(180deg,#ffd6e8,#ffc2d6,#ffb3d9);
    font-family:'Poppins',sans-serif;
    position:relative;
}

h1{
    font-family:'Great Vibes', cursive;
    font-size:50px;
    font-weight:400;
    color:#fffafc;
    line-height:1.1;
    text-shadow:
        0 0 4px #fff,
        0 0 10px #ff8fc4,
        0 0 18px #ff5fa2;
    margin-bottom:10px;
}

h1 span{
    display:block;
    font-size:68px;
    font-weight:400;
    color:#ff3f8e;
    -webkit-text-stroke:1px white;
    text-shadow:
        0 0 5px #fff,
        0 0 12px #ff69b4,
        0 0 20px #ff69b4;
}

.from{
margin-top:20px;
font-family:'Great Vibes',cursive;
font-size:34px;
color:#d81b60;
text-shadow:0 0 8px pink;
}

button{
margin-top:30px;
padding:16px 36px;
font-size:24px;
font-family:'Playfair Display',serif;
background:#ff4d88;
color:white;
border:none;
border-radius:50px;
cursor:pointer;
box-shadow:
0 0 15px #ff4d88,
0 0 30px hotpink;
transition:.3s;
}

button:hover{
transform:scale(1.08);
}

.hearts{
position:absolute;
bottom:-60px;
font-size:45px;
animation:float 6s linear infinite;
opacity:.9;
}

@keyframes float{
0%{
transform:translateY(0);
opacity:1;
}
100%{
transform:translateY(-110vh);
opacity:0;
}
}.made{
  margin-top:25px;
  font-family:'Poppins', sans-serif;
  font-size:18px;
  color:#b03a5b;
  letter-spacing:1px;
}

.bottom{
  margin-top:15px;
  font-family:'Poppins', sans-serif;
  font-size:16px;
  color:#b03a5b;
  letter-spacing:1px;
}
.forever{
  margin-top:20px;
  font-family:'Poppins', sans-serif;
  font-size:22px;
  font-weight:bold;
  color:#b03a5b;
  letter-spacing:1px;
}
#musicBtn{
position:fixed;
bottom:30px;
left:50%;
transform:translateX(-50%);
padding:15px 35px;
font-size:20px;
font-weight:bold;
border:none;
border-radius:40px;
background:linear-gradient(45deg,#ff4d6d,#ff1493);
color:white;
cursor:pointer;
z-index:9999;
box-shadow:0 6px 18px rgba(255,20,147,0.5);
}
</style>
</head>

<body>

<h1>
Happy Birthday
<span>Chandru ❤️</span>
</h1>

<p class="from">
With Love,<br>
Jeya 💖
</p>

<button onclick="window.location.href='surprise.html'">
💖 Just For You 💖
</button>
<p class="made">
  Made with love, just for you ❤️
</p>
<p class="bottom">
  May your day be filled with happiness and smiles ✨
</p>
<p class="forever">
  Forever Loving You ❤️
</p>
<div class="hearts" style="left:10%;animation-delay:0s;">❤️</div>
<div class="hearts" style="left:25%;animation-delay:1s;">💕</div>
<div class="hearts" style="left:40%;animation-delay:2s;">💖</div>
<div class="hearts" style="left:60%;animation-delay:3s;">💗</div>
<div class="hearts" style="left:75%;animation-delay:1.5s;">💝</div>
<div class="hearts" style="left:90%;animation-delay:2.5s;">❤️</div>
<button id="musicBtn" onclick="toggleMusic()">
🎵 Music ON
</button>
<script src="music.js"></script>
</body>
</html>
