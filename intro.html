<style>
body{
height:100vh;

<body>

<div id="count">3</div>

<script>

let count = 3;
let text = document.getElementById("count");

function speak(word){
 let voice = new SpeechSynthesisUtterance(word);
 voice.lang = "en-US";
 voice.pitch = 1.2;
 voice.rate = 0.8;
 speechSynthesis.speak(voice);
}

speak("Three");

let timer = setInterval(()=>{

 count--;

 if(count > 0){
   text.innerHTML = count;
   speak(count == 2 ? "Two" : "One");
 }

 else{
   clearInterval(timer);
   text.innerHTML="❤️";
   speak("Happy Birthday Chandru");
   
   setTimeout(()=>{
     window.location.href="index.html";
   },2000);
 }

},1000);

</script>
