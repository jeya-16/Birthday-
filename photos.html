<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chandru Memories ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background: linear-gradient(
180deg,
#0f0f0f,
#3d1028,
#8b2e5d,
#f7a8c9
);

font-family:'Poppins',sans-serif;

text-align:center;

min-height:100vh;

padding:40px 20px;

}


.container{

max-width:900px;

margin:auto;

}


.photo{

width:300px;

border-radius:20px;

box-shadow:0 0 20px hotpink;

}


.quote{

font-family:'Playfair Display',serif;

font-size:28px;

color:white;

line-height:1.8;

font-style:italic;

margin-top:30px;

text-shadow:0 2px 6px rgba(0,0,0,.3);

}


.birthday{

font-family:'Playfair Display',serif;

font-size:40px;

color:white;

margin-top:25px;

}


.signature{

font-family:'Great Vibes',cursive;

font-size:55px;

color:white;

margin-top:25px;

text-shadow:0 0 15px hotpink;

}


button{

margin-top:35px;

padding:15px 35px;

font-size:20px;

font-family:'Poppins',sans-serif;

background:linear-gradient(135deg,#ff4f9a,#b5175d);

color:white;

border:none;

border-radius:30px;

box-shadow:0 0 18px rgba(255,79,154,0.6);

}
.heart,.balloon{
position:fixed;
bottom:-60px;
font-size:28px;
animation:floatUp 8s linear infinite;
pointer-events:none;
}

@keyframes floatUp{
0%{
transform:translateY(0);
opacity:0;
}
20%{
opacity:1;
}
100%{
transform:translateY(-120vh);
opacity:0;
}
}
#musicBtn{
margin-top:20px;
background:none;
border:none;
font-size:30px;
cursor:pointer;
box-shadow:none;
padding:0;
}
</style>

</head>


<body>


<div class="container">


<img src="IMG-20260728-WA0011.jpg" class="photo">


<p class="quote">

You came into my life unexpectedly.<br>

But now, you mean everything to me.

</p>


<h2 class="birthday">

❤️ Happy Birthday Chandru ❤️

</h2>


<p class="signature">

Forever Yours,<br>

Jeya ❤️

</p>


<button onclick="location.href='photos2.html'">
One More Memory ❤️
</button>

</div>

<div class="heart" style="left:10%;animation-delay:0s;">❤️</div>
<div class="heart" style="left:30%;animation-delay:2s;">💖</div>
<div class="heart" style="left:50%;animation-delay:4s;">💕</div>
<div class="heart" style="left:70%;animation-delay:1s;">💗</div>
<div class="heart" style="left:90%;animation-delay:3s;">❤️</div>

<div class="balloon" style="left:20%;animation-delay:0s;">🎈</div>
<div class="balloon" style="left:40%;animation-delay:2s;">🎈</div>
<div class="balloon" style="left:60%;animation-delay:1s;">🎈</div>
<div class="balloon" style="left:80%;animation-delay:3s;">🎈</div>

</div>

<button id="musicBtn" onclick="toggleMusic()">▶️</button>

<script src="photo music.js"></script>
</body>

</html>
